AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Lambda de autenticação por CPF — Oficina Mecânica

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: python3.12
    Environment:
      Variables:
        DB_HOST: !Ref DBHost
        DB_PORT: !Ref DBPort
        DB_NAME: !Ref DBName
        DB_USER: !Ref DBUser
        DB_PASSWORD: !Ref DBPassword
        JWT_SECRET: !Ref JWTSecret
        JWT_EXPIRATION_HOURS: "24"

Parameters:
  DBHost:
    Type: String
  DBPort:
    Type: String
    Default: "5432"
  DBName:
    Type: String
    Default: "oficina"
  DBUser:
    Type: String
  DBPassword:
    Type: String
    NoEcho: true
  JWTSecret:
    Type: String
    NoEcho: true

Resources:
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: oficina-autenticacao
      CodeUri: src/
      Handler: handler.lambda_handler
      Description: Autentica cliente por CPF e retorna JWT
      Events:
        AuthEvent:
          Type: Api
          Properties:
            Path: /auth/login
            Method: post

Outputs:
  AuthApiUrl:
    Description: URL do endpoint de autenticação
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/auth/login"
  AuthFunctionArn:
    Description: ARN da Lambda
    Value: !GetAtt AuthFunction.Arn
